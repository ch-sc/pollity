name: Update poll data & deploy

on:
  schedule:
    - cron: "23 6 * * *"   # daily, 06:23 UTC — checks wahlrecht.de for new polls
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scrape wahlrecht.de
        if: github.event_name != 'push'
        run: python3 scraper/wahlrecht.py

      - name: Commit new data
        if: github.event_name != 'push'
        run: |
          if ! git diff --quiet web/data; then
            git config user.name "pollity-bot"
            git config user.email "actions@users.noreply.github.com"
            git add web/data
            git commit -m "data: refresh polls ($(date -u +%F))"
            git push
          else
            echo "No new polls."
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
